# Diagnostic: GetCurrentRegime gRPC test against Janus, v2.
# v1 used --network host from a container and could not dial the host's
# published ports (rootless-style netns mismatch) even though the ports
# are open on the host. v2 attaches grpcurl to the FKS compose network
# (fks_network) and dials the janus container directly — the same path
# a bridge service in the stack would use.
# Read-only: GetCurrentRegime + reflection list only.
#
# Dispatch manually via "Run workflow".

name: Test Janus GetCurrentRegime gRPC on oryx

on:
  workflow_dispatch:

jobs:
  check-grpc:
    runs-on: ubuntu-latest
    steps:
      - name: 🔌 Connect to Tailscale
        id: tailscale
        uses: nuniesmith/actions/.github/actions/tailscale-connect@main
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          target-ip: ${{ secrets.ORYX_TAILSCALE_IP }}
          target-ssh-port: ${{ secrets.SSH_PORT || '22' }}

      - name: 🔍 Call GetCurrentRegime via FKS network
        if: steps.tailscale.outputs.connected == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /tmp/regime-proto/fks/janus/v1
            cat > /tmp/regime-proto/fks/janus/v1/regime_bridge.proto << 'PROTOEOF'
            syntax = "proto3";
            package fks.janus.v1.bridge;
            service RegimeBridgeService {
              rpc PushRegimeState(PushRegimeStateRequest) returns (PushRegimeStateResponse);
              rpc PushRegimeStateBatch(PushRegimeStateBatchRequest) returns (PushRegimeStateBatchResponse);
              rpc GetCurrentRegime(GetCurrentRegimeRequest) returns (GetCurrentRegimeResponse);
              rpc StreamRegimeUpdates(StreamRegimeUpdatesRequest) returns (stream RegimeState);
            }
            enum HypothalamusRegime {
              HYPOTHALAMUS_REGIME_UNSPECIFIED = 0;
              HYPOTHALAMUS_REGIME_STRONG_BULLISH = 1;
              HYPOTHALAMUS_REGIME_BULLISH = 2;
              HYPOTHALAMUS_REGIME_NEUTRAL = 3;
              HYPOTHALAMUS_REGIME_BEARISH = 4;
              HYPOTHALAMUS_REGIME_STRONG_BEARISH = 5;
              HYPOTHALAMUS_REGIME_HIGH_VOLATILITY = 6;
              HYPOTHALAMUS_REGIME_LOW_VOLATILITY = 7;
              HYPOTHALAMUS_REGIME_TRANSITIONAL = 8;
              HYPOTHALAMUS_REGIME_CRISIS = 9;
              HYPOTHALAMUS_REGIME_UNKNOWN = 10;
            }
            enum AmygdalaRegime {
              AMYGDALA_REGIME_UNSPECIFIED = 0;
              AMYGDALA_REGIME_LOW_VOL_TRENDING = 1;
              AMYGDALA_REGIME_LOW_VOL_MEAN_REVERTING = 2;
              AMYGDALA_REGIME_HIGH_VOL_TRENDING = 3;
              AMYGDALA_REGIME_HIGH_VOL_MEAN_REVERTING = 4;
              AMYGDALA_REGIME_CRISIS = 5;
              AMYGDALA_REGIME_TRANSITIONAL = 6;
              AMYGDALA_REGIME_UNKNOWN = 7;
            }
            message RegimeIndicators {
              double trend = 1;
              double trend_strength = 2;
              double volatility = 3;
              double volatility_percentile = 4;
              double correlation = 5;
              double breadth = 6;
              double momentum = 7;
              double relative_volume = 8;
              double liquidity_score = 9;
              double fear_index = 10;
            }
            message RegimeState {
              string symbol = 1;
              HypothalamusRegime hypothalamus_regime = 2;
              AmygdalaRegime amygdala_regime = 3;
              double position_scale = 4;
              bool is_high_risk = 5;
              double confidence = 6;
              RegimeIndicators indicators = 7;
              int64 timestamp_us = 8;
              int64 sequence = 9;
              bool is_transition = 10;
              HypothalamusRegime previous_hypothalamus_regime = 11;
              AmygdalaRegime previous_amygdala_regime = 12;
            }
            message PushRegimeStateRequest {
              RegimeState state = 1;
              string source_id = 2;
            }
            message PushRegimeStateResponse {
              bool accepted = 1;
              string message = 2;
              uint64 processing_time_us = 3;
            }
            message PushRegimeStateBatchRequest {
              repeated RegimeState states = 1;
              string source_id = 2;
            }
            message PushRegimeStateBatchResponse {
              uint32 accepted_count = 1;
              uint32 rejected_count = 2;
              string message = 3;
              uint64 processing_time_us = 4;
            }
            message GetCurrentRegimeRequest {
              repeated string symbols = 1;
            }
            message GetCurrentRegimeResponse {
              repeated RegimeState states = 1;
              int64 server_timestamp_us = 2;
            }
            message StreamRegimeUpdatesRequest {
              string client_id = 1;
              repeated string symbols = 2;
              bool transitions_only = 3;
              double min_confidence = 4;
            }
            PROTOEOF
            echo "=== Networks on oryx (confirm fks_network) ==="
            docker network ls --format "{{.Name}}" | grep -i fks || echo "NO FKS NETWORK FOUND"
            echo ""
            echo "=== grpcurl reflection list: fks_janus:50052 (via fks_network) ==="
            docker run --rm --network fks_network fullstorydev/grpcurl -plaintext -connect-timeout 5 fks_janus:50052 list 2>&1 | head -25
            echo ""
            echo "=== GetCurrentRegime: fks_janus:50052 (empty symbols = all) ==="
            docker run --rm --network fks_network -v /tmp/regime-proto:/proto fullstorydev/grpcurl -plaintext -connect-timeout 5 -import-path /proto -proto fks/janus/v1/regime_bridge.proto -d '{}' fks_janus:50052 fks.janus.v1.bridge.RegimeBridgeService/GetCurrentRegime 2>&1 | head -120
            echo ""
            echo "=== grpcurl reflection list: fks_janus:50051 ==="
            docker run --rm --network fks_network fullstorydev/grpcurl -plaintext -connect-timeout 5 fks_janus:50051 list 2>&1 | head -25
            echo ""
            echo "=== GetCurrentRegime: fks_janus:50051 ==="
            docker run --rm --network fks_network -v /tmp/regime-proto:/proto fullstorydev/grpcurl -plaintext -connect-timeout 5 -import-path /proto -proto fks/janus/v1/regime_bridge.proto -d '{"symbols":["BTCUSDT","ETHUSDT","SOLUSDT"]}' fks_janus:50051 fks.janus.v1.bridge.RegimeBridgeService/GetCurrentRegime 2>&1 | head -40
