# ============================================================================
# CI/CD Pipeline for ORYX - Crypto Bot host
# ============================================================================
# Repository: nuniesmith/oryx
#
# Services: crypto-bot (Kraken live-trading bot, daily 200-day MA regime rule)
#
# Features:
#   - Deployment via Tailscale + SSH
#   - Git pull / clone + Docker Compose rebuild & restart
#   - .env assembled from GitHub Actions secrets on every deploy
# ============================================================================
name: 🖥️ Oryx Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (test workflow only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SERVER_NAME: oryx
  PROJECT_PATH: oryx

# A newer push used to CANCEL a deploy already running on the host, which can
# leave it halfway through stopping and starting containers. Deploys now queue
# behind the running one instead; GitHub keeps only the newest pending run, so
# a burst still ends with the latest commit deployed.
# Pull-request runs only test, so a new push may still cancel the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # DEPLOYMENT
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to Oryx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ======================================================================
      # TAILSCALE CONNECTION
      # ======================================================================
      - name: 🔌 Connect to Tailscale
        id: tailscale
        uses: nuniesmith/actions/.github/actions/tailscale-connect@main
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          target-ip: ${{ secrets.ORYX_TAILSCALE_IP }}
          target-ssh-port: ${{ secrets.SSH_PORT || '22' }}

      # ======================================================================
      # DEPLOY VIA SSH
      # ======================================================================
      - name: 🚀 Deploy via SSH
        id: deploy
        if: steps.tailscale.outputs.connected == 'true'
        uses: nuniesmith/actions/.github/actions/ssh-deploy@main
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'jordan' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          project-path: ${{ env.PROJECT_PATH }}
          git-pull: false
          git-branch: ${{ github.ref_name }}
          docker-prune: false
          pre-deploy-command: |
            echo "🖥️ Deploying to Oryx server..."

            # Create project directory if it doesn't exist
            echo "📁 Ensuring project directory exists..."
            mkdir -p $HOME/${{ env.PROJECT_PATH }}
            cd $HOME/${{ env.PROJECT_PATH }}

            # Handle git repository setup
            if [ -d .git ] && git status >/dev/null 2>&1; then
              echo "📥 Updating existing repository..."
              git fetch origin
              git checkout ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }} || {
                echo "⚠️ Git pull failed, doing hard reset..."
                git reset --hard origin/${{ github.ref_name }}
              }
            else
              echo "📥 Cloning repository (first deployment)..."
              cd ~
              rm -rf $HOME/${{ env.PROJECT_PATH }}
              git clone https://github.com/${{ github.repository }}.git $HOME/${{ env.PROJECT_PATH }}
              cd $HOME/${{ env.PROJECT_PATH }}
              git checkout ${{ github.ref_name }}
            fi

            echo "🔐 Setting up .env file..."
            # Rewrite-by-filter rather than sed: tokens can contain sed's
            # delimiter characters, and sed only substitutes existing lines.
            upsert_env() {
              key="$1"; value="$2"
              [ -z "$value" ] && return 0
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$value" >> .env.tmp
              mv .env.tmp .env
              echo "  ✓ ${key} configured"
            }
            touch .env
            upsert_env KRAKEN_API_KEY "${{ secrets.KRAKEN_API_KEY }}"
            upsert_env KRAKEN_API_SECRET "${{ secrets.KRAKEN_API_SECRET }}"
            upsert_env DISCORD_WEBHOOK_URL "${{ secrets.DISCORD_WEBHOOK_URL }}"
            upsert_env CRYPTO_BOT_ROOT "/app"
            chmod 600 .env

            # Verify the bot's secrets made it in — without keys it can only
            # read public endpoints, never trade.
            MISSING=""
            for key in KRAKEN_API_KEY KRAKEN_API_SECRET; do
              grep -q "^${key}=.\+" .env 2>/dev/null || MISSING="$MISSING $key"
            done
            if [ -n "$MISSING" ]; then
              echo "   ❌ Missing required secrets:$MISSING — set them in GitHub Actions secrets"
              exit 1
            fi
            echo "   ✅ .env ready ($(grep -c '^[A-Z_]' .env) keys)"

            # State directory for the bot's data volume (state.json lives here).
            # On the very first Docker deploy, copy the live state.json from the
            # systemd checkout so order tracking carries over — see README.
            echo "📁 Ensuring bot data directory exists..."
            mkdir -p ./data/crypto-bot/paper
            echo "   ✅ data dir ready"

          deploy-command: |
            # Without -e a failed `up` fell through to "✅ Deployment complete",
            # which is how an empty host reported success.
            set -euo pipefail

            # Action already cd's to PROJECT_PATH; use absolute path as safeguard
            cd $HOME/${{ env.PROJECT_PATH }}

            # Every image must be in hand BEFORE anything stops: a failed pull
            # after the stack is down leaves the host with nothing running.
            echo "📥 Building crypto-bot image (Dockerfile from nuniesmith/crypto#main)..."
            docker compose build --pull
            echo "✅ Image built"

            echo "🛑 Stopping existing services..."
            docker compose down --remove-orphans 2>/dev/null || true

            echo "🚀 Starting crypto-bot..."
            docker compose up -d --force-recreate --remove-orphans

            echo "✅ Deployment complete"

          post-deploy-command: |
            cd $HOME/${{ env.PROJECT_PATH }}
            echo ""
            echo "📊 Service Status:"
            docker compose ps --format "table {{.Name}}\t{{.Status}}" 2>/dev/null || docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "📋 Recent bot logs:"
            docker logs crypto-bot-live --tail 5 2>&1 | tail -5
            echo ""
            echo "✅ Deployment complete!"

      # ======================================================================
      # HEALTH CHECKS
      # ======================================================================
      - name: 🏥 Run Health Checks
        id: health-checks
        if: always() && steps.deploy.outcome == 'success'
        uses: nuniesmith/actions/.github/actions/health-check@main
        with:
          # The bot exposes no HTTP endpoint; the compose healthcheck asserts
          # the process is alive (PID 1) and the custom command asserts it is
          # actually trading (recent Kraken activity in the logs).
          containers: crypto-bot-live
          ssh-host: ${{ secrets.ORYX_TAILSCALE_IP }}
          ssh-port: ${{ secrets.SSH_PORT || '22' }}
          ssh-user: ${{ secrets.SSH_USER || 'jordan' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          initial-delay: 150
          retry-count: 3
          retry-delay: 20
          fail-on-unhealthy: true
          custom-command: |
            set -e
            logs=$(docker logs crypto-bot-live --since 10m 2>&1 | tail -20)
            echo "$logs" | tail -5
            echo "$logs" | grep -qiE 'starting bot|fetching kraken|regime|ledger'
