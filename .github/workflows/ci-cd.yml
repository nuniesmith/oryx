# ============================================================================
# CI/CD Pipeline for ORYX
# ============================================================================
# Repository: nuniesmith/oryx
#
# Services: btc-recorder (Binance BTC market-data recorder). The Kraken
# crypto-bot retired from this repo 2026-10-25 (FKS spawner-managed now).
#
# Features:
#   - Deployment via Tailscale + SSH
#   - Git pull / clone + Docker Compose rebuild & restart
#   - .env assembled from GitHub Actions secrets on every deploy
# ============================================================================
name: 🖥️ Oryx Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      # The FKS deploy runs only by dispatch, and a change to it is no reason
      # to force-recreate btc-recorder and leave a gap in the recording.
      - ".github/workflows/fks-deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (test workflow only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SERVER_NAME: oryx
  PROJECT_PATH: /home/actions/oryx

# A newer push used to CANCEL a deploy already running on the host, which can
# leave it halfway through stopping and starting containers. Deploys now queue
# behind the running one instead; GitHub keeps only the newest pending run, so
# a burst still ends with the latest commit deployed.
# Pull-request runs only test, so a new push may still cancel the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # DEPLOYMENT
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to Oryx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ======================================================================
      # TAILSCALE CONNECTION
      # ======================================================================
      - name: 🔌 Connect to Tailscale
        id: tailscale
        uses: nuniesmith/actions/.github/actions/tailscale-connect@main
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          target-ip: ${{ secrets.ORYX_TAILSCALE_IP }}
          target-ssh-port: ${{ secrets.SSH_PORT || '22' }}

      # ======================================================================
      # DEPLOY VIA SSH
      # ======================================================================
      - name: 📁 Bootstrap project directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/actions/oryx
            echo "✅ Project directory ready"

      - name: 🚀 Deploy via SSH
        id: deploy
        if: steps.tailscale.outputs.connected == 'true'
        uses: nuniesmith/actions/.github/actions/ssh-deploy@main
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          project-path: ${{ env.PROJECT_PATH }}
          git-pull: false
          git-branch: ${{ github.ref_name }}
          docker-prune: false
          pre-deploy-command: |
            echo "🖥️ Deploying to Oryx server..."

            # Create project directory if it doesn't exist
            echo "📁 Ensuring project directory exists..."
            mkdir -p ${{ env.PROJECT_PATH }}
            cd ${{ env.PROJECT_PATH }}

            # Handle git repository setup
            if [ -d .git ] && git status >/dev/null 2>&1; then
              echo "📥 Updating existing repository..."
              git fetch origin
              git checkout ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }} || {
                echo "⚠️ Git pull failed, doing hard reset..."
                git reset --hard origin/${{ github.ref_name }}
              }
            else
              echo "📥 Cloning repository (first deployment)..."
              cd ~
              rm -rf ${{ env.PROJECT_PATH }}
              git clone https://github.com/${{ github.repository }}.git ${{ env.PROJECT_PATH }}
              cd ${{ env.PROJECT_PATH }}
              git checkout ${{ github.ref_name }}
            fi

            # No .env is written anymore: the Kraken bot (its only
            # consumer) retired to the FKS stack 2026-10-25, and
            # btc-recorder needs no secrets — public Binance data only.

          deploy-command: |
            # Without -e a failed `up` fell through to "✅ Deployment complete",
            # which is how an empty host reported success.
            set -euo pipefail

            # Action already cd's to PROJECT_PATH; use absolute path as safeguard
            cd ${{ env.PROJECT_PATH }}

            # Every image must be in hand BEFORE anything stops: a failed pull
            # after the stack is down leaves the host with nothing running.
            # Images are built by their repos' CI and pushed to GHCR;
            # this host only pulls them.
            echo "📥 Pulling images..."
            docker compose pull
            echo "✅ Image pulled"

            echo "🛑 Stopping existing services..."
            docker compose down --remove-orphans 2>/dev/null || true

            echo "🚀 Starting services..."
            docker compose up -d --force-recreate --remove-orphans

            echo "✅ Deployment complete"

          post-deploy-command: |
            cd ${{ env.PROJECT_PATH }}
            echo ""
            echo "📊 Service Status:"
            docker compose ps --format "table {{.Name}}\t{{.Status}}" 2>/dev/null || docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "📋 Recent recorder logs:"
            docker logs btc-recorder --tail 5 2>&1 | tail -5
            echo ""
            echo "✅ Deployment complete!"

      # ======================================================================
      # HEALTH CHECKS
      # ======================================================================
      - name: 🏥 Run Health Checks
        id: health-checks
        if: always() && steps.deploy.outcome == 'success'
        uses: nuniesmith/actions/.github/actions/health-check@main
        with:
          # The recorder's compose healthcheck asserts its status.json
          # heartbeat is fresh; the custom command re-checks that from the
          # host and shows recent recorder logs.
          containers: btc-recorder
          ssh-host: ${{ secrets.ORYX_TAILSCALE_IP }}
          ssh-port: ${{ secrets.SSH_PORT || '22' }}
          ssh-user: ${{ secrets.SSH_USER || 'actions' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          initial-delay: 90
          retry-count: 3
          retry-delay: 20
          fail-on-unhealthy: true
          custom-command: |
            set -e
            docker inspect btc-recorder --format '{{.State.Health.Status}}' | grep -q healthy
            docker logs btc-recorder --since 10m 2>&1 | tail -5
