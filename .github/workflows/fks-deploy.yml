# ============================================================================
# CI/CD Pipeline for FKS on ORYX - Full trading stack host
# ============================================================================
# Repository: nuniesmith/oryx
#
# Deploys the FULL FKS stack (postgres, redis, questdb, qdrant, janus,
# spawner, webui, nginx, observability, botsync) from the nuniesmith/fks
# repo to /home/actions/fks on oryx, then syncs bots/*.yaml into the
# spawner and loads Kraken keys into its encrypted secret store.
#
# Features:
#   - Deployment via Tailscale + SSH (same pattern as ci-cd.yml)
#   - .env assembled from GitHub Actions secrets on every deploy;
#     service tokens auto-generate if missing (freddy pattern)
#   - Independent cadence from the crypto-bot deploys
# See: fks repo docs/ORYX.md
# ============================================================================
name: FKS Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fks-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fks-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (test workflow only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SERVER_NAME: oryx
  PROJECT_PATH: /home/actions/fks
  FKS_REPO: nuniesmith/fks
  FKS_REF: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: 🚀 Deploy FKS to Oryx
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔌 Connect to Tailscale
        id: tailscale
        uses: nuniesmith/actions/.github/actions/tailscale-connect@main
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          target-ip: ${{ secrets.ORYX_TAILSCALE_IP }}
          target-ssh-port: ${{ secrets.SSH_PORT || '22' }}

      - name: 📁 Bootstrap project directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/actions/fks
            echo "✅ Project directory ready"

      - name: 🚀 Deploy via SSH
        id: deploy
        if: steps.tailscale.outputs.connected == 'true'
        uses: nuniesmith/actions/.github/actions/ssh-deploy@main
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          project-path: ${{ env.PROJECT_PATH }}
          git-pull: false
          docker-prune: false
          pre-deploy-command: |
            set -euo pipefail
            echo "🖥️ Deploying FKS stack to Oryx..."

            # --- fks repo checkout (the system lives here, not in this repo) ---
            if [ -d ${{ env.PROJECT_PATH }}/.git ]; then
              echo "📥 Updating fks checkout..."
              cd ${{ env.PROJECT_PATH }}
              git fetch origin
              git checkout ${{ env.FKS_REF }}
              git reset --hard origin/${{ env.FKS_REF }}
            else
              echo "📥 Cloning fks (first deployment)..."
              rm -rf ${{ env.PROJECT_PATH }}
              git clone --branch ${{ env.FKS_REF }} \
                https://github.com/${{ env.FKS_REPO }}.git ${{ env.PROJECT_PATH }}
              cd ${{ env.PROJECT_PATH }}
            fi

            # --- oryx:80 must be free for the FKS nginx front door ---
            if ss -tln 2>/dev/null | grep -q ':80 '; then
              echo "⚠️  Something is already listening on :80:"
              ss -tlnp 2>/dev/null | grep ':80 ' || true
              echo "   Resolve before nginx can bind (fks.7gram.xyz front door)."
            else
              echo "  ✓ :80 free for nginx"
            fi

            # --- .env: rewrite-by-filter upsert (tokens may contain sed delimiters) ---
            upsert_env() {
              key="$1"; value="$2"
              [ -z "$value" ] && return 0
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$value" >> .env.tmp
              mv .env.tmp .env
              echo "  ✓ ${key} configured"
            }
            # Auto-generate a 64-hex token when the key is absent from .env
            # (same pattern as the freddy deploys Jordan approved).
            ensure_generated() {
              key="$1"
              if grep -q "^${key}=.\+" .env 2>/dev/null; then
                echo "  ✓ ${key} already set"
              else
                upsert_env "$key" "$(openssl rand -hex 32)"
              fi
            }
            touch .env

            echo "🔐 Setting up .env file..."
            # Supplied via GitHub secrets (upsert_env skips empty → falls through
            # to auto-generation below where applicable).
            upsert_env POSTGRES_PASSWORD "${{ secrets.POSTGRES_PASSWORD }}"
            upsert_env REDIS_PASSWORD "${{ secrets.REDIS_PASSWORD }}"
            upsert_env QUESTDB_PG_PASSWORD "${{ secrets.QUESTDB_PG_PASSWORD }}"
            upsert_env GRAFANA_PASSWORD "${{ secrets.GRAFANA_PASSWORD }}"
            upsert_env API_KEY "${{ secrets.API_KEY }}"
            upsert_env JANUS_API_TOKEN "${{ secrets.JANUS_API_TOKEN }}"
            upsert_env NGINX_INTERNAL_TOKEN "${{ secrets.NGINX_INTERNAL_TOKEN }}"
            upsert_env EVENTS_TOKEN "${{ secrets.EVENTS_TOKEN }}"
            upsert_env SPAWNER_SECRETS_KEY "${{ secrets.SPAWNER_SECRETS_KEY }}"
            upsert_env DISCORD_WEBHOOK_GENERAL "${{ secrets.DISCORD_WEBHOOK_GENERAL }}"
            upsert_env DISCORD_WEBHOOK_SIGNALS "${{ secrets.DISCORD_WEBHOOK_SIGNALS }}"
            upsert_env DISCORD_WEBHOOK_ANALYSIS "${{ secrets.DISCORD_WEBHOOK_ANALYSIS }}"
            upsert_env DEADMAN_PING_URL "${{ secrets.DEADMAN_PING_URL }}"
            # Kraken keys already exist as oryx repo secrets; the spawner loads
            # them into its encrypted store below (never into a bot .env).
            upsert_env KRAKEN_API_KEY "${{ secrets.KRAKEN_API_KEY }}"
            upsert_env KRAKEN_API_SECRET "${{ secrets.KRAKEN_API_SECRET }}"

            # Service tokens: auto-generate when absent.
            ensure_generated POSTGRES_PASSWORD
            ensure_generated REDIS_PASSWORD
            ensure_generated QUESTDB_PG_PASSWORD
            ensure_generated GRAFANA_PASSWORD
            ensure_generated API_KEY
            ensure_generated JANUS_API_TOKEN
            ensure_generated NGINX_INTERNAL_TOKEN
            ensure_generated EVENTS_TOKEN
            ensure_generated SPAWNER_SECRETS_KEY

            # Non-secret knobs.
            upsert_env COMPOSE_PROJECT_NAME "fks"
            upsert_env ALLOWED_BOT_IMAGE_PREFIX "ghcr.io/nuniesmith/"
            upsert_env REQUIRE_INTERNAL_TOKEN "true"
            upsert_env EXECUTION_MODE "paper_trading"
            upsert_env TZ "America/Toronto"
            upsert_env JANUS_REF "${{ vars.JANUS_REF || 'main' }}"
            upsert_env SPAWNER_REF "${{ vars.SPAWNER_REF || 'main' }}"
            upsert_env WEB_REF "${{ vars.WEB_REF || 'main' }}"
            # Host docker group for the spawner's /var/run/docker.sock mount.
            upsert_env DOCKER_GID "$(getent group docker | cut -d: -f3)"
            chmod 600 .env

            # Fail closed on the keys the stack cannot boot without.
            MISSING=""
            for key in POSTGRES_PASSWORD REDIS_PASSWORD SPAWNER_SECRETS_KEY NGINX_INTERNAL_TOKEN; do
              grep -q "^${key}=.\+" .env 2>/dev/null || MISSING="$MISSING $key"
            done
            if [ -n "$MISSING" ]; then
              echo "   ❌ Missing required secrets:$MISSING"
              exit 1
            fi
            echo "   ✅ .env ready ($(grep -c '^[A-Z_]' .env) keys)"

          deploy-command: |
            set -euo pipefail
            cd ${{ env.PROJECT_PATH }}

            # External volumes must pre-exist (compose won't create them).
            echo "📦 Ensuring external volumes..."
            for v in prometheus_data grafana_data alertmanager_data; do
              docker volume inspect "$v" >/dev/null 2>&1 || docker volume create "$v"
              echo "  ✓ $v"
            done

            # Images build on oryx from the fks repo (day one; GHCR prebuild
            # is a follow-up). Every image in hand BEFORE anything restarts.
            echo "🔨 Building FKS images (slow on first run)..."
            docker compose -f docker-compose.oryx.yml build
            echo "✅ Images built"

            echo "🚀 Starting FKS stack..."
            docker compose -f docker-compose.oryx.yml up -d --remove-orphans
            echo "✅ Stack started (botsync syncs bots/*.yaml into the spawner)"

            # Wait for the spawner, then load Kraken keys into its encrypted
            # secret store. bots/*.yaml declares `secrets: [kraken]`; a spawn
            # fails closed when the store has no kraken credentials.
            echo "🔑 Loading Kraken keys into spawner secret store..."
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:8091/health >/dev/null 2>&1 && break
              sleep 10
            done
            curl -sf http://127.0.0.1:8091/health >/dev/null
            python3 - <<'EOF'
            import json, os, urllib.request
            env = {}
            with open('.env') as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith('#') and '=' in line:
                        k, v = line.split('=', 1)
                        env[k.strip()] = v.strip()
            token = env.get('NGINX_INTERNAL_TOKEN', '')
            payload = json.dumps({
                'exchange': 'kraken',
                'api_key': env.get('KRAKEN_API_KEY', ''),
                'api_secret': env.get('KRAKEN_API_SECRET', ''),
            }).encode()
            req = urllib.request.Request(
                'http://127.0.0.1:8091/secrets', data=payload,
                headers={'Content-Type': 'application/json',
                         'X-Internal-Token': token})
            with urllib.request.urlopen(req, timeout=15) as r:
                body = json.loads(r.read())
            assert body.get('ok'), f"secret store rejected: {body}"
            print('  ✓ kraken credentials stored (exchange=kraken)')
            EOF

            echo ""
            echo "📊 Service Status:"
            docker compose -f docker-compose.oryx.yml ps --format "table {{.Name}}\t{{.Status}}" 2>/dev/null \
              || docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "✅ Deployment complete!"

          post-deploy-command: |
            cd ${{ env.PROJECT_PATH }}
            echo ""
            echo "📋 Recent spawner logs:"
            docker logs fks_bot_spawner --tail 5 2>&1 | tail -5
            echo ""
            echo "📋 botsync result:"
            docker ps -a --filter "name=fks_botsync" --format "table {{.Names}}\t{{.Status}}" | head -3
            docker logs fks_botsync 2>&1 | tail -5
            echo ""
            echo "✅ Deployment complete!"

      - name: 🏥 Run Health Checks
        id: health-checks
        if: always() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORYX_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/actions/fks
            echo "🏥 FKS health checks..."

            check() { # $1 = label, $2 = shell snippet (run via sh -c)
              label="$1"; script="$2"
              if sh -c "$script" >/dev/null 2>&1; then echo "  ✓ $label"; else
                echo "  ❌ $label"; FAILED=1
              fi
            }
            FAILED=0
            check "spawner :8091/health" "curl -sf http://127.0.0.1:8091/health"
            check "nginx :80" "curl -sf http://127.0.0.1:80/ -o /dev/null"
            check "janus :7000/health" "curl -sf http://127.0.0.1:7000/health"
            check "postgres pg_isready" "docker exec fks_postgres pg_isready -U fks_user"
            check "redis ping" 'docker exec fks_redis redis-cli -a "$(grep ^REDIS_PASSWORD= .env | cut -d= -f2-)" ping | grep -q PONG'
            check "botsync exited 0" \
              '[ "$(docker inspect -f "{{.State.ExitCode}}" fks_botsync 2>/dev/null)" = "0" ]'
            check "kraken creds in store" 'curl -sf -H "X-Internal-Token: $(grep ^NGINX_INTERNAL_TOKEN= .env | cut -d= -f2-)" http://127.0.0.1:8091/secrets/status | grep -q kraken'

            if [ "$FAILED" != "0" ]; then
              echo "❌ Health checks FAILED"
              exit 1
            fi
            echo "✅ All FKS health checks passed"
