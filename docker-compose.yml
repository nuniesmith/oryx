# Docker Compose for ORYX - Crypto Bot host
# ============================================================================
# Oryx runs the Kraken crypto-bot (daily 200-day MA regime rule) as a Docker
# service. The bot's Dockerfile lives in the nuniesmith/crypto repo; this
# compose file builds it straight from that repo's git URL so the oryx repo
# stays service-level only (same split as freddy/sullivan/princess).
#
# First deploy: copy the live state.json from the systemd deploy so order
# tracking and history carry over:
#   mkdir -p ./data/crypto-bot/paper
#   cp ~/github/crypto/data/paper/state.json ./data/crypto-bot/paper/state.json
# And stop the systemd unit so two bots never trade one account:
#   systemctl --user stop crypto-bot-live.service
#   systemctl --user disable crypto-bot-live.service
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  crypto-bot:
    build:
      # Dockerfile lives in the crypto repo; built fresh from main on deploy.
      context: https://github.com/nuniesmith/crypto.git#main
      dockerfile: Dockerfile
    image: crypto-bot:latest
    container_name: crypto-bot-live
    env_file:
      - .env # KRAKEN_API_KEY, KRAKEN_API_SECRET, DISCORD_WEBHOOK_URL (written by CI/CD)
    environment:
      CRYPTO_BOT_ROOT: /app
      TZ: ${TZ:-America/Toronto}
    volumes:
      # Bot state (state.json) — bind mount so it survives rebuilds.
      - ./data/crypto-bot:/app/data
    logging: *default-logging
    healthcheck:
      # PID 1 is the bot itself (ENTRYPOINT). No HTTP endpoint to probe.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
