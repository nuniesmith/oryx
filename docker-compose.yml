# Docker Compose for ORYX - Crypto Bot host
# ============================================================================
# Oryx runs the Kraken crypto-bot (daily 200-day MA regime rule) as a Docker
# service. The image is built by the nuniesmith/crypto repo's CI
# (docker-publish.yml) and pushed to ghcr.io/nuniesmith/crypto — this host
# only pulls it, so no Rust toolchain is needed here and deploys are fast.
#
# It also runs the BTC market-data recorder (service btc-recorder below).
# Its image is built the same way by the nuniesmith/btc repo's CI and pushed
# to ghcr.io/nuniesmith/btc. The recorder uses public Binance market data
# only — no API keys, no .env entries, no ports.
#
# Deploy flow: the oryx CI/CD (triggered by push to oryx main or manual
# dispatch) runs `docker compose pull` then recreates the container.
# .env (KRAKEN_API_KEY, KRAKEN_API_SECRET, DISCORD_WEBHOOK_URL) is written by
# the CI/CD from GitHub Actions secrets on every deploy.
#
# First deploy: copy the live state.json from the systemd deploy so order
# tracking and history carry over:
#   mkdir -p ./data/crypto-bot/paper
#   cp ~/github/crypto/data/paper/state.json ./data/crypto-bot/paper/state.json
# And stop the systemd unit so two bots never trade one account:
#   systemctl --user stop crypto-bot-live.service
#   systemctl --user disable crypto-bot-live.service
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  crypto-bot:
    # Prebuilt by crypto CI; the deploy pulls, never builds.
    image: ghcr.io/nuniesmith/crypto:latest
    container_name: crypto-bot-live
    env_file:
      - .env # KRAKEN_API_KEY, KRAKEN_API_SECRET, DISCORD_WEBHOOK_URL (written by CI/CD)
    environment:
      CRYPTO_BOT_ROOT: /app
      TZ: ${TZ:-America/Toronto}
    ports:
      # WebUI: dashboard + forecast calculator (princess proxies crypto.7gram.xyz here).
      - "8090:8090"
    volumes:
      # Bot state (state.json) — bind mount so it survives rebuilds.
      - ./data/crypto-bot:/app/data
    logging: *default-logging
    healthcheck:
      # WebUI dashboard endpoint.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/api/status > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  btc-recorder:
    # Prebuilt by the btc repo's CI (docker-publish.yml); deploy pulls only.
    # Records Binance BTCUSDT futures streams (forceOrder liquidations,
    # bookTicker, markPrice/funding, OI snapshots) to append-only JSONL.
    # Direct egress (no proxy), no secrets — public market data only.
    image: ghcr.io/nuniesmith/btc:latest
    container_name: btc-recorder
    environment:
      TZ: ${TZ:-America/Toronto}
    volumes:
      # Recorded data — bind mount so it survives rebuilds and can be
      # inspected/synced from the host. status.json and recorder.log live
      # in the container (also on stdout via docker logs).
      - ./data/btc-recorder:/app/data
    logging: *default-logging
    healthcheck:
      # No HTTP endpoint; assert the status.json heartbeat is fresh
      # (the recorder rewrites it continuously while running).
      test: ["CMD-SHELL", "python3 -c \"import json,time; s=json.load(open('/app/status.json')); assert (time.time()*1000 - s['updated_at_ms']) < 180000\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
